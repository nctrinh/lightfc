# LightFC tracker config (key = value). Keys and defaults: src/tracker/lightfc_config.h
# Values marked [yaml] must match the experiment yaml used to train the checkpoint;
# values marked [export] must match tracker/export/quantize_result/<part>/io_contract.json.

# --- models [export] -------------------------------------------------------------
# Folder with the 3 COMPILED models for your board (vai_c_xir output for Vitis AI).
model_dir = model/lightfc
backbone_template_model = backbone_template.xmodel
backbone_search_model = backbone_search.xmodel
fusion_head_model = fusion_head.xmodel
# Tensor-name substrings used to bind fusion_head I/O (outputs may be reordered by the compiler)
fusion_corr_input = input_0
fusion_xfeat_input = input_1
out_ctr = conv5_ctr
out_offset = conv5_offset
out_size = conv5_size

# --- geometry [yaml] -------------------------------------------------------------
template_size = 128
# REQUIRED, no default: TEST.TEMPLATE_FACTOR from the experiment yaml. The tracker refuses to start
# until this line is uncommented and set.
# template_factor = <TEST.TEMPLATE_FACTOR>
search_width = 640
search_height = 480
stride = 16
feat_channels = 96

# --- preprocessing ---------------------------------------------------------------
# gray: like training (ToGrayscale p=1). rgb: like lib_orin test initialize() (colour template).
template_mode = gray
mean = 0.485, 0.456, 0.406
std = 0.229, 0.224, 0.225

# --- runtime ---------------------------------------------------------------------
# < 0 disables lost-target detection (lib_orin has none). If enabled, tune it on int8 scores.
score_threshold = -1
show = 0
